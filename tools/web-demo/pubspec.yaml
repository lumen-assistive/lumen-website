name: lumen_website_demo
description: >-
  Compiles real business logic from lumen-plugins to JavaScript for the
  interactive demo on the lumen-website site. Not published, not part
  of the app: a build tool for the website only.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  lumen_plugin_vedere:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/vedere
  lumen_plugin_protezione:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/protezione
  lumen_plugin_sentire:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/sentire
  lumen_plugin_famiglia:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/famiglia
  lumen_plugin_parlare:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/parlare
  lumen_plugin_leggere:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/leggere
  lumen_plugin_ricordare:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/ricordare
  lumen_plugin_muoversi:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.2.0
      path: packages/muoversi

dev_dependencies:
  lints: ^4.0.0
