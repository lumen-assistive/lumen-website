name: lumen_website_demo
description: >-
  Compiles real business logic from lumen-plugins to JavaScript for the
  interactive demo on the lumen-website site. Not published, not part
  of the app: a build tool for the website only.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  lumen_plugin_vision:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/vision
  lumen_plugin_safety:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/safety
  lumen_plugin_hearing:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/hearing
  lumen_plugin_family:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/family
  lumen_plugin_speech:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/speech
  lumen_plugin_reading:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/reading
  lumen_plugin_memory:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/memory
  lumen_plugin_mobility:
    git:
      url: https://github.com/lumen-assistive/lumen-plugins.git
      ref: v0.3.0
      path: packages/mobility

dev_dependencies:
  lints: ^4.0.0
